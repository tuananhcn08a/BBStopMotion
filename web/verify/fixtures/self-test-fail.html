<!doctype html>
<!--
  verify/fixtures/self-test-fail.html — CHÍNH self-test.html nhưng cố ý đổi
  #app-root padding 24px → 40px (lệch 16px, > ngưỡng 2px mặc định). Dùng để
  chứng minh AC2: harness phải báo FAIL đúng dòng bị lệch (sidebar/main/capture-btn
  dịch sang phải+xuống 16px), PASS ở landmark không đổi (app-root không dịch vì
  nó là gốc — vẫn ở x0,y0 dù padding đổi).
-->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Self-test fixture (LỆCH padding) — T-BS03</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; background: #f3f6fb; }
      #app-root { padding: 40px; display: flex; gap: 16px; } /* <-- 24px -> 40px: lệch cố ý */
      #sidebar { width: 120px; height: 250px; background: #ffffff; border-radius: 16px; }
      #main { width: 260px; height: 250px; background: #e9f1fe; border-radius: 16px; padding: 20px; box-sizing: border-box; }
      #capture-btn { width: 60px; height: 60px; border-radius: 50%; background: #ff6b35; margin-top: 20px; }
    </style>
  </head>
  <body>
    <div id="app-root" data-landmark="app-root">
      <div id="sidebar" data-landmark="sidebar"></div>
      <div id="main" data-landmark="main">
        <div id="capture-btn" data-landmark="capture-btn"></div>
      </div>
    </div>
  </body>
</html>
